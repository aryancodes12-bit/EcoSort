server.port=8080
spring.application.name=ecosort-ai

# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Groq API Key (retrieved from environment variable) — used for text-only classification
groq.api.key=${GROQ_API_KEY:}
# Groq model for text completion
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# Gemini API Key (retrieved from environment variable) — used for image analysis (multimodal)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
